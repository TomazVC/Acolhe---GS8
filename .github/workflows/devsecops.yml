name: Acolhe DevSecOps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar imagem e atualizar Azure previamente provisionado"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: acolhe-${{ github.ref }}
  # Never cancel a main run mid-deploy; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/static/app.js
      - run: node --test tests/frontend.test.cjs
      - name: Detect secrets in history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-banner --redact --exit-code=1
      - name: Semgrep local rules (no external code upload)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.111.0 semgrep scan --config /src/devsecops/semgrep.yml --error --metrics=off /src/app /src/robot /src/rpa /src/big_data
      - name: Build image
        run: docker build --pull -t acolhe:${{ github.sha }} .
      - name: Run suite inside runtime image
        run: docker run --rm -v "$PWD:/source:ro" -w /source acolhe:${{ github.sha }} python -B -m unittest discover -v
      - name: Smoke actual image HTTP and SQLite
        run: |
          set -eu
          docker run -d --name acolhe-runtime-test -p 127.0.0.1:8080:8080 acolhe:${{ github.sha }}
          trap 'docker logs acolhe-runtime-test; docker rm -f acolhe-runtime-test' EXIT
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2) as r:
                      assert r.status == 200
                  break
              except Exception:
                  if attempt == 29: raise
                  time.sleep(1)
          for path in ['/', '/logo.png', '/api/lessons', '/api/summary', '/api/gold']:
              with urllib.request.urlopen('http://127.0.0.1:8080'+path, timeout=5) as r:
                  assert r.status == 200, path
          print('Image HTTP smoke passed')
          PY
          docker exec acolhe-runtime-test python -c "import os,sqlite3; assert os.getuid()==10001; c=sqlite3.connect('/tmp/smoke.db'); c.execute('CREATE TABLE smoke (id INTEGER)'); c.execute('INSERT INTO smoke VALUES (1)'); c.commit(); assert c.execute('SELECT id FROM smoke').fetchone()==(1,); c.close(); print('Non-root SQLite smoke passed')"
      - name: Trivy image vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.60.0 image --exit-code 1 --severity HIGH,CRITICAL acolhe:${{ github.sha }}
      - name: Trivy IaC
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.60.0 config --exit-code 1 --severity HIGH,CRITICAL --skip-files /src/devsecops/Dockerfile.candidate /src
        # Dockerfile.candidate is the base-image experiment (not shipped). Trivy 0.60 DS-0017 is a
        # false positive there: apt-get update is followed by upgrade + cache removal in the same RUN.
      - name: Preserve tested image
        run: docker save acolhe:${{ github.sha }} -o /tmp/acolhe-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: /tmp/acolhe-image.tar
          retention-days: 3
  deploy:
    needs: test-and-build
    # Automatic continuous deployment: every push to main that passes all gates
    # deploys the exact tested image. Manual dispatch remains available.
    if: >-
      github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp
      - name: Publish tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker load -i /tmp/acolhe-image.tar
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "acolhe:$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy existing Container App
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
        run: az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
      - name: Post-deploy health check
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
        run: |
          set -eu
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/api/health"; then echo; echo "Deployed: https://$FQDN"; exit 0; fi
            sleep 5
          done
          echo "Health check failed after deploy" >&2; exit 1

